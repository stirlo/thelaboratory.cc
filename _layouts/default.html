<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Laboratory — experiments, applications, and working systems">
    <meta name="theme-color" content="#edf1ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)">
    {% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
    {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}

    <!-- Version every icon reference because browsers retain favicon caches aggressively. -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/tfp-apple-touch-icon.png' | relative_url }}?v={{ site.asset_version }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/tfp-favicon-32x32.png' | relative_url }}?v={{ site.asset_version }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/tfp-favicon-16x16.png' | relative_url }}?v={{ site.asset_version }}">
    <link rel="shortcut icon" href="{{ '/tfp-favicon.ico' | relative_url }}?v={{ site.asset_version }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}?v={{ site.asset_version }}">
    <link rel="mask-icon" href="{{ '/tfp-safari-pinned-tab.svg' | relative_url }}?v={{ site.asset_version }}" color="#ff6500">

    <script>
      // Apply a saved choice before paint so day/night changes never flash.
      (function () {
        const savedTheme = localStorage.getItem('laboratory-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.asset_version }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to projects</a>
    {% include header.html %}

    <main id="main-content" class="content">
      <div class="container">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/shell.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  </body>
</html>
